<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROBE — a terminal extraction game</title>
    <meta name="description" content="Pilot a tethered probe through a fog-eaten world. Haul cargo, launch the uplink.">
    <meta property="og:title" content="PROBE">
    <meta property="og:description" content="Pilot a tethered probe through a fog-eaten world. Haul cargo, launch the uplink.">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22black%22/%3E%3Ctext x=%223%22 y=%2213%22 font-family=%22monospace%22 font-size=%2213%22 fill=%22%2355ff55%22%3E^%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <div id="stats" aria-label="Expedition status">
        <div>TIME <span id="val-time">0</span></div>
        <div>SIGNAL <span id="val-signal">0</span></div>
        <div>TETHER <span id="val-len">0</span>/<span id="val-max-len">35</span></div>
        <div>CARGO <span id="val-res">0</span>/<span id="val-goal">25</span></div>
    </div>
    <div id="drone-status" aria-live="polite">DRONES: 0/0 ALIVE | ACTIVE: NONE</div>
    <div id="drone-roster" aria-label="Drone roster"></div>
    <div id="log" role="status" aria-live="polite">SYSTEM READY.</div>
    <div id="game-screen" aria-label="ASCII game map"></div>
    <div id="legend" aria-label="Controls and map legend"></div>
    <div class="toolbar">
        <button type="button" id="btn-help" class="tool">HELP</button>
        <button type="button" id="btn-hangar" class="tool">HANGAR</button>
        <button type="button" id="btn-import" class="tool">IMPORT SAVE</button>
        <input type="file" id="import-input" accept=".json" hidden>
    </div>
    <div id="overlay"></div>

    <div class="ctrl-layer" role="group" aria-label="Game controls">
        <div class="d-pad" role="group" aria-label="Movement controls">
            <span></span><button type="button" class="btn" id="btn-up" aria-label="Move up">↑</button><span></span>
            <button type="button" class="btn" id="btn-left" aria-label="Move left">←</button><button type="button" class="btn" id="btn-down" aria-label="Move down">↓</button><button type="button" class="btn" id="btn-right" aria-label="Move right">→</button>
        </div>
        <div class="action-pad" role="group" aria-label="Actions">
            <button type="button" class="btn action-btn" id="btn-exec" aria-keyshortcuts="Space Enter">EXEC</button>
            <button type="button" class="btn action-btn" id="btn-scan" aria-keyshortcuts="P" aria-label="Scan for creatures, P">SCAN [P]</button>
            <button type="button" class="btn action-btn vent-btn" id="btn-vent" aria-keyshortcuts="V" aria-label="Vent nearest airlock, V">VENT [V]</button>
            <button type="button" class="btn action-btn" id="btn-sound" aria-keyshortcuts="M" aria-pressed="true" aria-label="Sound enabled, M">SOUND ON</button>
        </div>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
