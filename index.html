<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PROBE — a terminal extraction game</title>
    <meta name="description" content="Pilot a tethered probe through a fog-eaten world. Haul cargo, launch the uplink.">
    <meta property="og:title" content="PROBE">
    <meta property="og:description" content="Pilot a tethered probe through a fog-eaten world. Haul cargo, launch the uplink.">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22black%22/%3E%3Ctext x=%223%22 y=%2213%22 font-family=%22monospace%22 font-size=%2213%22 fill=%22%2355ff55%22%3E^%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <div id="stats">
        <div>TIME <span id="val-time">0</span></div>
        <div>SIGNAL <span id="val-signal">0</span></div>
        <div>TETHER <span id="val-len">0</span>/<span id="val-max-len">35</span></div>
        <div>CARGO <span id="val-res">0</span>/<span id="val-goal">25</span></div>
    </div>
    <div id="log">SYSTEM READY.</div>
    <div id="game-screen"></div>
    <div id="legend"></div>
    <div class="toolbar">
        <button id="btn-help" class="tool">HELP</button>
        <button id="btn-hangar" class="tool">HANGAR</button>
        <button id="btn-import" class="tool">IMPORT SAVE</button>
        <input type="file" id="import-input" accept=".json" style="display:none">
    </div>
    <div id="overlay"></div>

    <div class="ctrl-layer">
        <div class="d-pad">
            <div></div><div class="btn" id="btn-up">↑</div><div></div>
            <div class="btn" id="btn-left">←</div><div class="btn" id="btn-down">↓</div><div class="btn" id="btn-right">→</div>
        </div>
        <div class="btn action-btn" id="btn-exec">EXEC</div>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
